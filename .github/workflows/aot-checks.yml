name: AOT compatibility checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "验收的提交或标签；留空使用触发工作流的提交"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Source gates and reflection-free JSON
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run automated source gates and AOT reflection checks
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite Gate,Aot -Configuration Release

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('artifacts/test-results/**') != ''
        with:
          name: aot-test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
